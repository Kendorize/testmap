.card{max-height:94vh;overflow:auto}
#gm{position:fixed;inset:0;z-index:20;background:#1d1a24;font-family:'Pixelify Sans',sans-serif;touch-action:none}

#gt{position:absolute;right:10px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:6px}
.gb{width:36px;height:36px;border-radius:10px;border:3px solid var(--bd);background:var(--wd);color:var(--tx);font-size:16px;cursor:pointer;padding:0}
.gb.on{background:#ffd3e6;outline:2px solid #ff7aa8}

#cs{width:44px;height:auto}
